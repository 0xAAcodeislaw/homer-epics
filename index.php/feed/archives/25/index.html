<description>特洛伊人溃败，分成两路逃命。一路逃进城去，普里阿摩斯下令紧闭城门，任凭城外的人哭嚎，一条命换全城的命；另一路被赶进斯卡曼德河中。阿喀琉斯跳进水里，用长矛点名：抓住特洛伊人的儿子！他生擒十二名青年...</description>
