<description>翌日拂晓，宙斯召集众神立下严令：谁也不许插手今日之战，违者打入地狱。他自己登上伊达山巅，黄金天平两端各放特洛伊与希腊的命运砝码——希腊的一端沉向大地。天平一倾，他的雷霆劈在希腊军阵中央，天地变色。</description>
