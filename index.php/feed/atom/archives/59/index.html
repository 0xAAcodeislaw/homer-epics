<title type="text">荷马史诗 - 神明何用？——奥林匹斯的叙事功能 的评论</title>
<subtitle type="text">读荷马的人常有一个疑问：神怎么到处插手？打斗要请神助阵，选边要靠掷签，连人心的动摇都归给一位下凡的女神。这算不算是&quot;迷信&quot;？</subtitle>
