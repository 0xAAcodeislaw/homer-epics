<title type="text">荷马史诗 - 客谊法则——宙斯看护的陌生人 的评论</title>
<subtitle type="text">《奥德赛》里，一个陌生人可以走进陌生人的家门，吃住三日，临行获赠重礼，而主人分文不取。这不是奇风异俗，而是一整套神圣制度：客谊（xenia）。</subtitle>
