<title type="text">荷马史诗 - 卷十三 · 船边的死斗 的评论</title>
<subtitle type="text">宙斯的目光暂时转向了别处。海神波塞冬抓住这个空档，化作老先知卡尔卡斯的样子，出现在阵中——他是阿伽门农的兄长辈，海之君主，岂能眼睁睁看着弟弟们的船被烧？他重振两名埃阿斯的士气，又奔赴各处激励将领...</subtitle>
