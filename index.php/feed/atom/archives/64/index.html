<title type="text">荷马史诗 - 一面盾上的世界——史诗的艺术与人间 的评论</title>
<subtitle type="text">《伊利亚特》第十八卷，战事正酣，诗人却按下了暂停键，用了约一百三十行，描写神匠赫菲斯托斯为阿喀琉斯锻造新盾。这段&quot;盾之描写&quot;是西方文学最早的器物诗，也是全诗的隐藏核心。</subtitle>
