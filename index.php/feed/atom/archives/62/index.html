<title type="text">荷马史诗 - 智谋与归乡——《奥德赛》的另一条英雄标准 的评论</title>
<subtitle type="text">如果说《伊利亚特》是一部&quot;力量&quot;的史诗，《奥德赛》就是一部&quot;智谋&quot;的史诗。它的第一行就给主角定了性：那个&quot;辗转多谋&quot;（polytropos）的人——走过许多城邦、见过许多人心、拐过无数弯路的人。</subtitle>
