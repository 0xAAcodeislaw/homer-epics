<title type="text">荷马史诗 - 卷十七 · 乞丐入城 的评论</title>
<subtitle type="text">翌日，忒勒马科斯先行进城，嘱咐欧迈俄斯带&quot;乞丐&quot;随后跟来。临行前他叮嘱牧猪人：路过城门口那块石碑，别急着念叨主人——雷伊奥斯的狗阿尔戈斯还卧在那里。</subtitle>
