<title type="text">荷马史诗 - 循环史诗 · 归途——英雄们的不同回家路 的评论</title>
<subtitle type="text">特洛伊焚尽，诸王登船。《归途》写的是除奥德修斯外诸英雄的回家路——有人平安，有人漂泊，有人死在自家门口。这首诗像一面散场镜子：战争结束了，账才刚刚开始。</subtitle>
