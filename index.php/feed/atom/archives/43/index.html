<title type="text">荷马史诗 - 卷十三 · 重返伊萨卡 的评论</title>
<subtitle type="text">奥德修斯讲完了。满殿动容，阿尔基诺奥斯送他三件青铜宝物，贵人们各赠厚礼，一夜置办齐整。费埃克斯人的神船载着熟睡的英雄破浪而行，一夜之间渡过千里——船抵伊萨卡海湾，水手把沉睡的他连人带礼抬上沙滩，...</subtitle>
