<title type="text">荷马史诗 - 卷二十三 · 葬礼竞技 的评论</title>
<subtitle type="text">当晚，密尔弥多纳人护送帕特洛克罗斯的遗体回到营中。阿喀琉斯把杀人复仇的怒火按下，与全军一起哀悼挚友：灵床边供上剪下的鬃发、涂满蜂蜜与油脂的羊牛，又在火堆上杀马、杀犬、杀那十二名特洛伊青年——青铜...</subtitle>
