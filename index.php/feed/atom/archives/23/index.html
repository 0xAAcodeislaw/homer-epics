<title type="text">荷马史诗 - 卷十九 · 誓师出征 的评论</title>
<subtitle type="text">黎明前，忒提斯把新甲送到，阿喀琉斯披挂上正。他召集全军，当众宣布：我放下怒气，重回战场——战争等不了人。阿伽门农起身&quot;道歉&quot;，却说了一句经典甩锅：&quot;是神让我一时发昏，宙斯和阿特丢失的怨火最难消退...</subtitle>
