<title type="text">荷马史诗 - 循环史诗 · 忒勒戈尼亚——最后的意外 的评论</title>
<subtitle type="text">《奥德赛》的团圆之后还有故事吗？有的——《忒勒戈尼亚》给出了循环史诗的终章，也是古代读者吐槽最多的一部：它把一个圆满的结局，又续写成了一个意外。</subtitle>
