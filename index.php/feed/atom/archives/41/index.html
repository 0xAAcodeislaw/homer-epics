<title type="text">荷马史诗 - 卷十一 · 自述三：冥府之旅 的评论</title>
<subtitle type="text">船抵大地尽头，冥河汇入冥府之地。奥德修斯挖坑献祭：黑羊的血混着蜂蜜、酒与水，亡魂闻血而来，但要喝血之前，必须先挥剑拦住，只许回答问题。</subtitle>
