<title type="text">荷马史诗 - 名场面细读 · 认疤——《奥德赛》卷十九 的评论</title>
<subtitle type="text">老乳母欧律克勒娅给&quot;乞丐&quot;洗脚，摸到膝盖上一道旧疤，失声喊出&quot;奥德修斯！&quot;——而叙事在此时突然停住，花七十多行讲起这道疤的来历。这就是著名的&quot;认疤&quot;一场，叙事学的教科书。</subtitle>
