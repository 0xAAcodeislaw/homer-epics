<title type="text">荷马史诗 - 名场面细读 · 城门诀别——《伊利亚特》卷六 的评论</title>
<subtitle type="text">赫克托耳与安德洛玛刻的城门诀别，是《伊利亚特》里唯一没有战场与神明的名场面——却让两千八百年来的读者反复落泪。它好在哪里？</subtitle>
