<title type="text">荷马史诗 - 卷十六 · 父子相认 的评论</title>
<subtitle type="text">忒勒马科斯与欧迈俄斯互道别来之事：求婚者设伏未成，家产日渐耗空。他叮嘱牧猪人进城给珀涅罗珀报个平安，自己留下陪客人。欧迈俄斯前脚出门，雅典娜后脚现身——她招手示意奥德修斯出棚，挥杖抹去乞丐的伪装...</subtitle>
