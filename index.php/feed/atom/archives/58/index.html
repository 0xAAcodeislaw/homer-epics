<title type="text">荷马史诗 - 阿喀琉斯的选择——愤怒史诗的核心 的评论</title>
<subtitle type="text">《伊利亚特》的第一个词是&quot;愤怒&quot;（μῆνις）。整部一万五千行的史诗，从愤怒开始，到愤怒平息结束。读懂这个愤怒，就读懂了这部诗。</subtitle>
