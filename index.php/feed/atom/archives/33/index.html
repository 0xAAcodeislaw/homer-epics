<title type="text">荷马史诗 - 卷三 · 皮洛斯的传说 的评论</title>
<subtitle type="text">船到皮洛斯，涅斯托尔正在海滩上主持一场盛大的公祭：九排坐席、九十头牛，献与海神。来客受到礼遇，忒勒马科斯道明来意：我想打听父亲的消息。</subtitle>
