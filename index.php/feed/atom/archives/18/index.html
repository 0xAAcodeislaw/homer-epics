<title type="text">荷马史诗 - 卷十四 · 神后设局，战局逆转 的评论</title>
<subtitle type="text">阿伽门农带伤来到船边，彻底灰心了：撤吧，把船拖下水，趁夜逃回希腊！这话让奥德修斯瞪圆了眼：让全军听听这话，他们立刻就造反——统帅说出这种丧气话，成何体统！老将涅斯托尔折中：船来不及下水，先退守船...</subtitle>
