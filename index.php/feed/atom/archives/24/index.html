<title type="text">荷马史诗 - 卷二十 · 诸神参战 的评论</title>
<subtitle type="text">宙斯终于解禁：众神随意下场，各自帮衬一方——免得阿喀琉斯违逆命运、提前攻陷特洛伊。奥林匹斯山顿时空了一半：雅典娜、赫拉、波塞冬、赫尔墨斯、赫菲斯托斯为希腊而战；阿瑞斯、阿波罗、阿佛洛狄忒、阿尔忒...</subtitle>
