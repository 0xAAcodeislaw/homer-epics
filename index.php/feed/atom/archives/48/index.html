<title type="text">荷马史诗 - 卷十八 · 乞丐斗殴 的评论</title>
<subtitle type="text">翌日，宫里来了个真正的职业乞丐伊洛斯，惯于沿门讨食。他见&quot;老头子&quot;抢生意，出言挑衅。安提诺俄斯等人立马起哄：斗一场，赢家吃烤肠！奥德修斯撩起破衣，露出宽肩厚背——满座倒吸一口凉气。伊洛斯吓得直哆...</subtitle>
