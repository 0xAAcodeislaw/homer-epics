<title type="text">荷马史诗 - 卷三 · 城头看海伦，阵前赌海伦 的评论</title>
<subtitle type="text">两军逼近，气氛肃杀。特洛伊一方突然提议：何必十年血战？让祸根自己了断——帕里斯与墨涅拉俄斯单挑，胜者带走海伦与全部财宝，两军盟誓休战。这提议得到应允，老年特洛伊王普里阿摩斯亲自出城主持盟誓。</subtitle>
