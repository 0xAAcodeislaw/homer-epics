<title type="text">荷马史诗 - 卷二十 · 复仇前夜 的评论</title>
<subtitle type="text">这一夜，全伊萨卡无人安睡。奥德修斯在院中辗转，亲见女仆们窃笑私通求婚者，怒火中烧；忒勒马科斯从城外赶回，父子各自装作不识；雷声在无云的晴空炸响——宙斯的暗号。珀涅罗珀在楼上哭到力竭，梦见丈夫就在...</subtitle>
