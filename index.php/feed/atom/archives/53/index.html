<title type="text">荷马史诗 - 卷二十三 · 夫妻相认 的评论</title>
<subtitle type="text">殿内火光重燃。珀涅罗珀下楼，在火边坐下，久久打量那个陌生男人——既不敢认，也不敢问。忒勒马科斯急了：母亲，我这颗心比石头还硬吗？二十年，坐在这里不哭不问！她答：&quot;我有我的道理。&quot;她只吩咐：为客人...</subtitle>
