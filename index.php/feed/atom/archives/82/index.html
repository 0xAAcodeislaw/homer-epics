<title type="text">荷马史诗 - 后世回声 · 但丁与地狱里的尤利西斯 的评论</title>
<subtitle type="text">中世纪的欧洲读荷马很难——希腊文几近失传，拉丁译本残缺。但丁没有读过《奥德赛》全文，却在他想象的地狱里，为奥德修斯安排了整个文学史上最惊人的一次&quot;改写&quot;。</subtitle>
