<title type="text">荷马史诗 - 循环史诗 · 小伊利亚特——智取前夜 的评论</title>
<subtitle type="text">阿喀琉斯既死，特洛伊的城墙仍在。《小伊利亚特》讲的是破城前最后的筹备：一具预言家的脑子、一副无坚不摧的弓、一匹巨大的马。</subtitle>
