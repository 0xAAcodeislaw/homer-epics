<title type="text">荷马史诗 - 卷九 · 使团求和 的评论</title>
<subtitle type="text">三位使者来到阿喀琉斯营中。他正在弹琴低唱英雄往事，见到老友起身相迎——哪怕在盛怒之中，他也以礼相待。宴罢，奥德修斯陈说军情：特洛伊人已逼到船边，希腊人的存亡系于英雄一身；随后他转述阿伽门农的道歉...</subtitle>
