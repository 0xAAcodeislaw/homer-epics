<title type="text">荷马史诗 - 后世回声 · 乔伊斯《尤利西斯》——把史诗装进一天 的评论</title>
<subtitle type="text">1922年，都柏林。一个小人物布卢姆用十八个小时，走完了奥德修斯十年的路。乔伊斯的《尤利西斯》被认为是二十世纪最重要的小说——而它的每一章，都对应着《奥德赛》的一卷。</subtitle>
