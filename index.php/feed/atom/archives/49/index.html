<title type="text">荷马史诗 - 卷十九 · 洗脚认疤 的评论</title>
<subtitle type="text">夜深人静，珀涅罗珀与&quot;乞丐&quot;长谈。她讲起自己的苦：当年织寿衣骗求婚者三年，夜夜拆掉；如今计穷，弓比试在即，无可再拖。又讲起当年送别丈夫的一幕——他握着她的手说：若我回不来，让忒勒马科斯长大便好；...</subtitle>
