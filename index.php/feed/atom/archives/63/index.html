<title type="text">荷马史诗 - 织机与长弓——史诗中的女性 的评论</title>
<subtitle type="text">荷马史诗是男人的战场，但撑起两部长诗骨架的，是一群女性：女神、王后、公主、女俘、老乳母。读她们，能读出史诗最柔软也最锋利的一面。</subtitle>
