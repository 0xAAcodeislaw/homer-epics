<title type="text">荷马史诗 - 卷四 · 斯巴达的老王 的评论</title>
<subtitle type="text">斯巴达王宫富丽如神殿，墨涅拉俄斯与海伦正嫁女娶媳。来客入席，海伦亲手为客人调了一味&quot;忘忧酒&quot;——掺着埃及灵草的药酒，饮者一夕忘愁，纵然父母双亡也不落泪。席间她讲起在特洛伊城中，只有奥德修斯能识破...</subtitle>
