<description>奥林匹斯山上，宙斯与赫拉斗起了嘴。宙斯说：干脆讲和，海伦归希腊，特洛伊城留给你——总行了吧？赫拉恼怒地拒绝：我才不要一座将亡之城的施舍！在她心里，特洛伊早就该毁灭。宙斯于是顺水推舟：那就打下去—...</description>
