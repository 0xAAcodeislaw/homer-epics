<description>翌日，阿尔基诺奥斯召集全城，备下盛宴与竞技款待贵客。席间盲诗人德摩多科斯弹唱特洛伊的故事——唱到奥德修斯与阿喀琉斯的争吵、木马入城，宾客中那个自称陌生人的人却把斗篷蒙在头上，无声流泪。只有国王看见了。</description>
