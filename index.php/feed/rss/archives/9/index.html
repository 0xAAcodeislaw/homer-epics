<description>这一卷属于狄俄墨得斯——阿尔戈斯年轻的国王。雅典娜把勇气与力量灌进他的身体，又为他拨开眼前的迷雾，让他能认出下场的神祇：她叮嘱他，凡人的血肉尽管杀，不朽的神明则要避开，唯有一个例外。</description>
