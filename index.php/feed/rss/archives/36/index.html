<description>斯刻里亚岛住着费埃克斯人——航海无双、与诸神比邻的乐土之民。国王阿尔基诺奥斯的女儿瑙西卡当夜做了一个梦：雅典娜化作她的闺中密友，催她明晨去河边洗衣服——你嫁期将近，该准备嫁衣了。</description>
