<title>荷马史诗 - 后世回声 · 维吉尔《埃涅阿斯纪》——帝国的荷马 的评论</title>
<link>https://0xaacodeislaw.github.io/homer-epics/index.php/archives/81/</link>
<description>公元前二十九年，屋大维刚刚终结内战，罗马亟需一个&quot;天命所归&quot;的故事。诗人维吉尔领命：写一部罗马的荷马。十年成书十二卷，临终仍嘱托焚稿——所幸奥古斯都留下它。此后两千年，它是欧洲学生的第一本史诗。</description>
