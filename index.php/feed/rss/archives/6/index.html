<description>宙斯没有忘记对忒提斯的承诺。当夜他遣一个&quot;梦神&quot;降到熟睡的阿伽门农枕边，假传神意：即刻出兵，明日便可攻陷特洛伊——因为诸神已经不再偏袒这座城。阿伽门农醒来深信不疑，全然不知这是个把他往深渊里引的假梦。</description>
