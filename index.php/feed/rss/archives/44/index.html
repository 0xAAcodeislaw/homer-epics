<title>荷马史诗 - 卷十四 · 牧猪人的棚屋 的评论</title>

<description>欧迈俄斯的猪棚建在山岩上，十二个猪圈，四条猛犬。老牧猪人见&quot;乞丐&quot;进来，劈手抢过他披着的旧皮——&quot;狗会咬坏它&quot;——又捧出猪下颚肉、葡萄酒，倾其所有待客。他说：主人若在，我何至于这样苦？可他死在海...</description>
