<script>
(function () {
  var D = JSON.parse(document.getElementById('vdata').textContent);
  var list = document.getElementById('list');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function card(v) {
    var fig = document.createElement('figure');
    var wrap = document.createElement('div');
    wrap.className = 'vwrap';
    wrap.setAttribute('data-id', v.id);
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
    img.alt = v.title;
    var play = document.createElement('div');
    play.className = 'play';
    var span = document.createElement('span');
    span.textContent = '▶';
    play.appendChild(span);
    wrap.appendChild(img);
    wrap.appendChild(play);
    var cap = document.createElement('figcaption');
    cap.innerHTML = '<div class="vtitle">' + esc(v.title) + '</div>' +
      '<div class="vmeta"><span class="badge ' + v.lang + '">' + (v.lang === 'zh' ? '中文' : 'EN') + '</span>' +
      '<span>' + esc(v.author) + '</span>' +
      (v.dur ? '<span>' + esc(v.dur) + '</span>' : '') +
      (v.views ? '<span>' + esc(v.views) + '</span>' : '') +
      '<a href="https://www.youtube.com/watch?v=' + v.id + '" target="_blank" rel="noopener">YouTube ↗</a></div>';
    fig.appendChild(wrap);
    fig.appendChild(cap);
    var playing = false;
    wrap.addEventListener('click', function () {
      if (playing) return;
      playing = true;
      var f = document.createElement('iframe');
      f.setAttribute('src', 'https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1&rel=0');
      f.setAttribute('title', v.title);
      f.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
      f.setAttribute('allowfullscreen', '');
      wrap.insertBefore(f, wrap.firstChild);
    });
    return fig;
  }
  var h1 = document.createElement('h2');
  h1.className = 'sec';
  h1.innerHTML = '中文解说 <span class="cnt">' + D.zh.length + ' 部</span>';
