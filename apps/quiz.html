    var html = '<div class="q">' + (i + 1) + '. ' + item[0] + '</div>';
    item[1].forEach(function (opt, j) {
      html += '<button class="opt" data-j="' + j + '">' + opt + '</button>';

        card.querySelectorAll('.opt').forEach(function (b, j) {
